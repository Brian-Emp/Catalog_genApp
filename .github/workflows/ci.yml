name: CI

on:
  push:
    branches: [main, finalisation]
  pull_request:

# Least privilege: the default GITHUB_TOKEN is read-only for this workflow.
permissions:
  contents: read

jobs:
  test:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        # Fails on errors only; the existing warnings are surfaced for
        # incremental cleanup, not enforced.
        run: npm run lint

      - name: Audit (high+ only, advisory)
        # Advisory by design (|| true): surfaces high/critical deps in the logs
        # without breaking the build on uncontrollable upstream advisories. The
        # remaining moderates are non-reachable transitives in exceljs (uuid).
        run: npm audit --audit-level=high || true

      - name: Tests
        # Unit + integration TS suite (no network). The Docker/C++ end-to-end
        # tests self-skip when no `app` container is running (see dockerOk()),
        # so they are exercised locally via `npm run smoke`, not in CI.
        run: npx vitest run
